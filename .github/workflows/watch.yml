# 通行止め情報のページを毎朝確認し、変わっていたら Issue を立てる（Issue の通知メールで気づける）。
# あわせて Supabase に1回問い合わせる（無料プランは7日間アクセスがないと一時停止されるため）。
# 手動で動かすときは Actions タブ →「Watch closures」→「Run workflow」。
name: Watch closures

on:
  schedule:
    - cron: "47 20 * * *"   # 毎日 5:47（日本時間）
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency: watch

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: PDF を文字にする道具を入れる
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils >/dev/null

      - name: ページを確認
        run: python3 tools/watch.py | tee -a "$GITHUB_STEP_SUMMARY"

      - name: 変化があれば Issue を立てる
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f data/watch/changes.md ]; then
            gh issue create --title "通行止め情報の更新 $(TZ=Asia/Tokyo date +%Y-%m-%d)" --body-file data/watch/changes.md
          fi

      - name: 保存した内容をコミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/watch
          if git diff --cached --quiet; then echo "変更なし"; exit 0; fi
          git commit -m "通行止め情報のページを確認 $(TZ=Asia/Tokyo date +%Y-%m-%d) [skip ci]"
          git pull --rebase
          git push

  keep-supabase-awake:
    runs-on: ubuntu-latest
    steps:
      - name: Supabase に問い合わせる（一時停止を防ぐ）
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          url="$(printf '%s' "$SUPABASE_URL" | tr -d '[:space:]' | sed -e 's#/rest/v1/*$##' -e 's#/*$##')"
          key="$(printf '%s' "$SUPABASE_ANON_KEY" | tr -d '[:space:]')"
          # 小さい範囲の林道を1回取るだけ（データは変えない）
          code=$(curl -sS -o /tmp/res.json -w '%{http_code}' -X POST "$url/rest/v1/rpc/segments_in_bbox" \
            -H "apikey: $key" -H "Content-Type: application/json" \
            -d '{"min_lon":139.0,"min_lat":36.1,"max_lon":139.01,"max_lat":36.11}')
          echo "応答 $code（$(wc -c < /tmp/res.json) バイト）" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "::notice title=Supabase::応答 $code $(head -c 200 /tmp/res.json | tr -d '\n')"
          if [ "$code" != "200" ]; then
            echo "Supabase から正常な応答がありません。一時停止されていないか、ダッシュボードを確認してください" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
