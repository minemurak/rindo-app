# XcodeGen の設定ファイル。GitHub Actions 上で `xcodegen generate` を実行して
# RindoApp.xcodeproj を生成する（Xcodeプロジェクト自体はリポジトリに入れない）。
#
name: RindoApp
options:
  bundleIdPrefix: com.minemurak
  deploymentTarget:
    iOS: "26.0"                         # 最新のiOSに合わせて上げる
packages:
  MapLibre:
    url: https://github.com/maplibre/maplibre-gl-native-distribution
    from: "6.0.0"
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: "2.0.0"
targets:
  RindoApp:
    type: application
    platform: iOS
    sources: [Sources]
    dependencies:
      - package: MapLibre
      - package: Supabase
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: 林道アプリ
        NSLocationWhenInUseUsageDescription: 現在地を地図に表示するために使います
        ITSAppUsesNonExemptEncryption: false   # HTTPS通信のみ。輸出申告の画面を毎回出さない
        UILaunchScreen: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.minemurak.ridomap
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"                      # iPhoneのみ
