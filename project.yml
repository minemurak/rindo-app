# XcodeGen の設定ファイル。GitHub Actions 上で `xcodegen generate` を実行して
# RindoApp.xcodeproj を生成する（Xcodeプロジェクト自体はリポジトリに入れない）。
#
name: RindoApp
options:
  bundleIdPrefix: com.minemurak
  deploymentTarget:
    iOS: "26.0"                         # 最新のiOSに合わせて上げる
packages:
  MapLibre:
    url: https://github.com/maplibre/maplibre-gl-native-distribution
    from: "6.0.0"
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: "2.0.0"
targets:
  RindoApp:
    type: application
    platform: iOS
    sources: [Sources]
    dependencies:
      - package: MapLibre
      - package: Supabase
    entitlements:
      path: Sources/RindoApp.entitlements
      properties:
        com.apple.developer.applesignin: [Default]   # Apple でサインイン（口コミの投稿用）
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: 林道アプリ
        CFBundleShortVersionString: $(MARKETING_VERSION)   # 表示上のバージョン
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)        # ビルド番号（GitHub Actions の実行番号）
        NSLocationWhenInUseUsageDescription: 現在地を地図に表示するために使います
        ITSAppUsesNonExemptEncryption: false   # HTTPS通信のみ。輸出申告の画面を毎回出さない
        UILaunchScreen: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.minemurak.rindomap
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"                      # iPhoneのみ
